name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in pyproject.toml to publish (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python -m pip install . build twine
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from aka3 import __version__
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          expected = os.environ['EXPECTED_VERSION']
          if version != expected or __version__ != expected:
              raise SystemExit(f'Expected {expected!r}, found metadata={version!r}, module={__version__!r}')
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/aka3/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@release/v1
